name: Build Custom Kernel MT6833 CPH2339

on:
  workflow_dispatch:
  push:
    branches:
      - oppo/mtk_s_12.1

jobs:
  build:
    name: Compile Linux Kernel 4.14
    runs-on: ubuntu-22.04

    steps:
      - name: Kiểm tra và dọn dẹp không gian đĩa runner
        run: |
          df -h
          sudo apt-get clean

      - name: Cài đặt các gói phụ thuộc (Build Dependencies)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            git \
            zip \
            unzip \
            curl \
            python3 \
            python-is-python3 \
            cpio \
            device-tree-compiler

      - name: Kéo mã nguồn Repo Kernel (Checkout Source)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Tự động tải và thiết lập thư mục vendor (OPPO Modules)
        run: |
          if [ ! -d "vendor" ]; then
            echo "-> Thư mục vendor chưa có sẵn trong repo, đang tự động clone từ kho modules..."
            git clone --depth=1 https://github.com/oppo-source/android_kernel_modules_oppo_mtk5g.git -b oppo/mtk_s_12.1 ../modules_vendor || \
            git clone --depth=1 https://github.com/NPT28122011/android_kernel_modules_oppo_mtk5g.git -b oppo/mtk_s_12.1 ../modules_vendor

            if [ -d "../modules_vendor/vendor" ]; then
              cp -r ../modules_vendor/vendor ./vendor
              echo "-> Đã nạp thành công thư mục vendor vào cây mã nguồn!"
            else
              echo "::error ::Không thể tìm thấy thư mục vendor trong kho modules!"
              exit 1
            fi
          else
            echo "-> Đã phát hiện thư mục vendor có sẵn trong repo."
          fi

          # Tạo các symlink phòng ngừa lỗi đường dẫn của MediaTek và Oppo
          ln -sf "$(pwd)/vendor" "../vendor" || true
          ln -sf . kernel-4.14 || true
          ln -sf "$(pwd)" "../kernel-4.14" || true

      - name: Tích hợp BakaSU (KernelSU)
        run: |
          curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash -

      - name: Bảo toàn Vermagic chuẩn xác "4.14.186+" (Triệt tiêu bẫy Dirty Tree)
        run: |
          # 1. Tạo file .scmversion chỉ chứa duy nhất dấu cộng
          printf "+" > .scmversion

          # 2. Vô hiệu hóa việc scripts/setlocalversion tự động gắn đuôi -dirty do BakaSU sửa code
          sed -i 's/res="\$res\*"/\#res="\$res\*"/g' scripts/setlocalversion || true
          sed -i 's/res="\$res-dirty"/\#res="\$res-dirty"/g' scripts/setlocalversion || true

      - name: Tải Toolchain chuẩn AOSP (Clang 11 r383902 & GCC 4.9)
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/toolchains"
          cd "${GITHUB_WORKSPACE}/toolchains"

          echo "-> Đang tải AOSP Clang 11.0.1 (build 6443078 / r383902)..."
          git clone --depth=1 https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-6443078.git clang

          echo "-> Đang tải AOSP GCC 4.9 AArch64..."
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 -b android-10.0.0_r47 gcc64

          echo "-> Đang tải AOSP GCC 4.9 ARM32..."
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 -b android-10.0.0_r47 gcc32

      - name: Khởi tạo cấu hình Kernel từ defconfig của Operator
        run: |
          export PATH="${GITHUB_WORKSPACE}/toolchains/clang/bin:${GITHUB_WORKSPACE}/toolchains/gcc64/bin:${GITHUB_WORKSPACE}/toolchains/gcc32/bin:${PATH}"

          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          mkdir -p out
          printf "+" > out/.scmversion

          # Nạp trực tiếp file k6833v1_64_defconfig đã chuẩn hóa thủ công từ VS Code
          make O=out ARCH=arm64 k6833v1_64_defconfig
                    # Cưỡng chế tắt các cờ gây lệch cấu trúc module Wi-Fi
          sed -i 's/CONFIG_USER_NS=y/# CONFIG_USER_NS is not set/' out/.config
          sed -i 's/CONFIG_SYSVIPC=y/# CONFIG_SYSVIPC is not set/' out/.config
          sed -i 's/CONFIG_POSIX_MQUEUE=y/# CONFIG_POSIX_MQUEUE is not set/' out/.config

          # Kiểm tra chuỗi Vermagic thực tế sinh ra
          echo "=== KIỂM TRA CHUỖI KERNEL RELEASE SINH RA ==="
          make O=out ARCH=arm64 kernelrelease

      - name: Thực thi biên dịch nhân nhị phân (Compile Image.gz-dtb)
        shell: bash
        run: |
          set -e
          set -o pipefail

          export PATH="${GITHUB_WORKSPACE}/toolchains/clang/bin:${GITHUB_WORKSPACE}/toolchains/gcc64/bin:${GITHUB_WORKSPACE}/toolchains/gcc32/bin:${PATH}"

          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            Image.gz-dtb 2>&1 | tee build.log

      - name: Đóng gói thành phẩm (Package Artifacts)
        if: always()
        run: |
          mkdir -p output_artifacts
          
          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            cp out/arch/arm64/boot/Image.gz-dtb output_artifacts/
            echo "-> Đã gom Image.gz-dtb thành công."
          fi

          if [ -f "out/.config" ]; then
            cp out/.config output_artifacts/kernel_actual.config
          fi

          if [ -f "build.log" ]; then
            cp build.log output_artifacts/
          fi

      - name: Tải thành phẩm lên GitHub Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CPH2339-Kernel-Build
          path: output_artifacts/